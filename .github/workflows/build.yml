name: Build GnwayAgent

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    # windows-latest 已内置 .NET SDK + .NET Framework 4.8 + MSBuild
    # 无需 setup-dotnet，直接编译即可
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # 编译服务端 Agent
    - name: Build Agent (Server)
      run: |
        cd Agent
        dotnet build -c Release

    # 编译客户端 Controller
    - name: Build Controller (Client)
      run: |
        cd Controller
        dotnet build -c Release

    # 编译发票自动化 InvoiceRunner
    - name: Build InvoiceRunner
      run: |
        cd InvoiceRunner
        dotnet build -c Release

    # 上传编译结果，可直接在 Actions 页面下载
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GnwayAgent-Release
        path: |
          Agent/bin/Release/net48/agent.exe
          Controller/bin/Release/net48/controller.exe
          InvoiceRunner/bin/Release/net48/invoice-runner.exe
        retention-days: 30
