name: Build GnwayAgent

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # 编译服务端 Agent (Python + pywinauto 重构版)
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Build Agent (Server)
      run: |
        cd Agent
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        pyinstaller --onefile --name agent main.py

    # 编译客户端 Controller (WinForms)
    - name: Build Controller (Client)
      run: |
        cd Controller
        dotnet build -c Release

    # 上传编译结果（含 controller.exe, flows/ 以及 events/ 目录）
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GnwayAgent-Release
        path: |
          Agent/dist/agent.exe
          Controller/bin/Release/net48/controller.exe
          Controller/bin/Release/net48/flows/
          Controller/bin/Release/net48/events/
        retention-days: 30
